<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Quartzolit AI</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    .topbar {
      height: 42px;
      background: #000;
      color: #ffd100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      font-weight: bold;
      border-bottom: 3px solid #ffd100;
    }

    .subtitle {
      color: #aaa;
      font-size: 12px;
      font-weight: normal;
    }

    .wrap {
      padding: 14px;
      height: calc(100vh - 70px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .intro {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 14px;
      max-width: 620px;
    }

    .quick {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .quick button {
      border: 1px solid #ddd;
      background: #f3f3f3;
      border-radius: 18px;
      padding: 8px 14px;
      cursor: pointer;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 10px;
    }

    .msg {
      max-width: 75%;
      padding: 12px 14px;
      border-radius: 12px;
      margin: 10px 0;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .user {
      background: #000;
      color: #ffd100;
      margin-left: auto;
      border-bottom-right-radius: 2px;
    }

    .bot {
      background: #fff;
      color: #111;
      border: 1px solid #ddd;
      margin-right: auto;
      border-bottom-left-radius: 2px;
    }

    .inputArea {
      display: flex;
      gap: 8px;
      border-top: 2px solid #ffd100;
      padding-top: 10px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }

    .send {
      width: 54px;
      border: none;
      border-radius: 8px;
      background: #ffd100;
      cursor: pointer;
      font-weight: bold;
    }

    pre {
      white-space: pre-wrap;
      font-size: 12px;
      background: #f2f2f2;
      padding: 8px;
      border-radius: 8px;
      overflow-x: auto;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div>● QUARTZOLIT AI</div>
    <div class="subtitle">Assistente de Dados</div>
  </div>

  <div class="wrap">
    <div class="intro">
      Olá! Sou a IA da Quartzolit com acesso ao modelo semântico.<br><br>
      Pergunte sobre <b>receita, volume, margem, score, alertas e ponto de ataque</b>.

      <div class="quick">
        <button onclick="window.enviarPergunta('Quais são as famílias críticas?')">Famílias críticas?</button>
        <button onclick="window.enviarPergunta('Resumo do cenário')">Resumo do cenário</button>
        <button onclick="window.enviarPergunta('Qual a receita por UF?')">Receita por UF</button>
        <button onclick="window.enviarPergunta('Qual o score por categoria?')">Score por categoria</button>
      </div>
    </div>

    <div id="chat"></div>

    <div class="inputArea">
      <input id="pergunta" placeholder="Digite sua pergunta aqui..." />
      <button class="send" onclick="window.enviar()">▶</button>
    </div>
  </div>

  <script>
    console.log("INDEX FINAL CARREGADO");

    window.enviar = async function () {
      const input = document.getElementById("pergunta");
      const pergunta = input.value.trim();

      if (!pergunta) return;

      await window.enviarPergunta(pergunta);
      input.value = "";
    };

    window.enviarPergunta = async function (pergunta) {
      const chat = document.getElementById("chat");

      chat.innerHTML += `<div class="msg user">${pergunta}</div>`;

      const loading = document.createElement("div");
      loading.className = "msg bot";
      loading.innerHTML = "Consultando modelo semântico...";
      chat.appendChild(loading);

      chat.scrollTop = chat.scrollHeight;

      try {
        const response = await fetch("https://quartzolit-api-6a8h.vercel.app/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            question: pergunta
          })
        });

        const data = await response.json();

        console.log("STATUS:", response.status);
        console.log("RESPOSTA API:", data);

        if (!response.ok) {
          loading.innerHTML = `
Erro: ${data.error || "Erro desconhecido"}

${JSON.stringify(data.details || data, null, 2)}
          `;
          return;
        }

        loading.innerHTML = data.answer || "A API respondeu, mas não retornou answer.";

      } catch (error) {
        console.error("ERRO FETCH:", error);
        loading.innerHTML = "Erro de conexão: " + error.message;
      }

      chat.scrollTop = chat.scrollHeight;
    };

    document.getElementById("pergunta").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        window.enviar();
      }
    });
  </script>
</body>
</html>
