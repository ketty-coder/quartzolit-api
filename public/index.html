<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quartzolit AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;font-family:'Segoe UI',sans-serif;background:#f5f5f5}
.wrap{display:flex;flex-direction:column;width:100%;height:100vh}
.hdr{background:#000;border-bottom:3px solid #FFD100;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.dot{width:7px;height:7px;background:#FFD100;border-radius:50%;animation:pu 2s infinite}
.dot.red{background:#c00}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
.hdr h1{font-size:12px;font-weight:700;color:#FFD100;letter-spacing:1px}
.hdr em{font-size:10px;color:#888;margin-left:auto;font-style:normal}
.msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0}
.bbl{max-width:86%;padding:9px 13px;border-radius:12px;font-size:12px;line-height:1.55;word-break:break-word}
.bbl.u{background:#000;color:#FFD100;align-self:flex-end;border-radius:12px 12px 3px 12px;font-weight:600}
.bbl.a{background:#fff;color:#222;align-self:flex-start;border:1px solid #ddd;border-radius:12px 12px 12px 3px}
.bbl.a b{color:#000}
.bbl.t{background:#fff;border:1px solid #ddd;align-self:flex-start;padding:8px 13px}
.dots span{display:inline-block;width:6px;height:6px;background:#FFD100;border-radius:50%;animation:bo 1.2s infinite;margin:0 2px}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bo{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
.suggs{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.sg{background:#f0f0f0;border:1.5px solid #ddd;color:#555;font-size:11px;padding:5px 11px;border-radius:14px;cursor:pointer;font-family:inherit}
.sg:hover{border-color:#FFD100;color:#000}
.foot{padding:8px 10px;background:#fff;border-top:2px solid #FFD100;display:flex;gap:7px;align-items:center;flex-shrink:0}
#editor{flex:1;background:#f5f5f5;border:1.5px solid #ccc;color:#111;padding:9px 13px;border-radius:9px;font-size:13px;outline:none;font-family:inherit;min-height:38px;max-height:80px;overflow-y:auto;cursor:text}
#editor:focus{border-color:#FFD100;background:#fff}
#editor:empty:before{content:'Digite sua pergunta sobre os dados...';color:#aaa;pointer-events:none}
#btn{background:#FFD100;color:#000;border:none;padding:9px 18px;border-radius:9px;font-size:14px;font-weight:900;cursor:pointer;flex-shrink:0}
#btn:disabled{opacity:.35}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr"><div class="dot" id="statusDot"></div><h1>QUARTZOLIT AI</h1><em id="hdrInfo">Carregando dados...</em></div>
  <div class="msgs" id="msgs"><div class="bbl a" id="msgInicial">Conectando ao modelo semantico Power BI...</div></div>
  <div class="foot"><div id="editor" contenteditable="true"></div><button id="btn" disabled>&#9658;</button></div>
</div>
<script>
var pbiCtx = null;
var M = document.getElementById('msgs');
var ed = document.getElementById('editor');
var btn = document.getElementById('btn');
var dot = document.getElementById('statusDot');
var hdr = document.getElementById('hdrInfo');
var mi = document.getElementById('msgInicial');

function sb(){ M.scrollTop = M.scrollHeight; }

function boldify(t){
  var parts = t.split('**');
  var r = '';
  for(var i=0;i<parts.length;i++) r += i%2===0 ? parts[i] : '<b>'+parts[i]+'</b>';
  return r.split('\n').join('<br>');
}

function am(t,c){
  var d=document.createElement('div');
  d.className='bbl '+c;
  d.innerHTML=boldify(t);
  M.appendChild(d); sb();
}

function st(){
  var d=document.createElement('div');
  d.className='bbl t'; d.id='tp';
  d.innerHTML="<div class='dots'><span></span><span></span><span></span></div>";
  M.appendChild(d); sb();
}

function rt(){ var t=document.getElementById('tp'); if(t)t.remove(); }

var suggs = '<div class="suggs">' +
  '<span class="sg" id="s1">Familias criticas?</span>' +
  '<span class="sg" id="s2">Indicadores vs ano anterior?</span>' +
  '<span class="sg" id="s3">Acao recomendada?</span>' +
  '<span class="sg" id="s4">Resumo do cenario</span>' +
  '</div>';

// ETAPA 1: Busca dados do PBI via /api/dados (endpoint separado, limite 10s)
fetch('/api/dados')
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(d.context){
      pbiCtx = d.context;
      // Extrai periodo do contexto
      var match = pbiCtx.match(/Periodo: ([^
]+)/);
      var periodo = match ? match[1] : 'Dados carregados';
      hdr.textContent = periodo;
      dot.classList.remove('red');
      mi.innerHTML = 'Ola! IA da Quartzolit conectada ao modelo semantico.<br><br>'
        + '<small style="color:#666">' + pbiCtx.split('\n').slice(0,3).join(' | ') + '</small><br><br>'
        + 'Pergunte sobre <b>scores, alertas, variacoes e ponto de ataque</b>!' + suggs;
      btn.disabled = false;
      ['s1','s2','s3','s4'].forEach(function(id){
        var el=document.getElementById(id);
        if(el) el.addEventListener('click',function(){ ed.textContent=this.textContent; go(); });
      });
    } else {
      dot.classList.add('red');
      hdr.textContent = 'Erro ao carregar dados';
      mi.innerHTML = 'Erro ao conectar ao modelo: ' + (d.error||'desconhecido') + '<br><br>Tente recarregar a pagina.' + suggs;
      btn.disabled = false;
      ['s1','s2','s3','s4'].forEach(function(id){
        var el=document.getElementById(id);
        if(el) el.addEventListener('click',function(){ ed.textContent=this.textContent; go(); });
      });
    }
  })
  .catch(function(e){
    dot.classList.add('red');
    hdr.textContent = 'Sem conexao PBI';
    mi.innerHTML = 'Nao foi possivel carregar dados do Power BI.<br><br>Pergunte assim mesmo:' + suggs;
    btn.disabled = false;
    ['s1','s2','s3','s4'].forEach(function(id){
      var el=document.getElementById(id);
      if(el) el.addEventListener('click',function(){ ed.textContent=this.textContent; go(); });
    });
  });

var H = [];

function go(){
  var t=(ed.textContent||ed.innerText||'').trim();
  if(!t) return;
  ed.textContent=''; btn.disabled=true;
  am(t,'u'); H.push({role:'user',content:t}); st();

  // ETAPA 2: Envia mensagem + contexto PBI para /api/chat (so Claude, limite 10s)
  fetch('/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ messages:H, pbiContext: pbiCtx })
  }).then(function(r){ return r.json(); }).then(function(d){
    rt();
    if(d.content&&d.content[0]){
      var rep=d.content[0].text;
      H.push({role:'assistant',content:rep});
      am(rep,'a');
    } else if(d.error){
      am('Erro: '+(d.error.message||d.error),'a');
    } else {
      am('Sem resposta.','a');
    }
    btn.disabled=false; ed.focus();
  }).catch(function(e){ rt(); am('Erro: '+e.message,'a'); btn.disabled=false; });
}

btn.addEventListener('click',function(){ go(); });
ed.addEventListener('keydown',function(e){ if(e.keyCode===13&&!e.shiftKey){e.preventDefault();go();} });
function fix(){ var w=document.querySelector('.wrap'); if(w)w.style.height=window.innerHeight+'px'; }
window.addEventListener('resize',fix); fix();
</script>
</body>
</html>
