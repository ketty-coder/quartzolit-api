<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quartzolit AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;font-family:'Segoe UI',sans-serif;background:#f5f5f5}
.wrap{display:flex;flex-direction:column;width:100%;height:100vh}
.hdr{background:#000;border-bottom:3px solid #FFD100;padding:8px 12px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.dot{width:7px;height:7px;background:#FFD100;border-radius:50%;animation:pu 2s infinite}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
.hdr h1{font-size:12px;font-weight:700;color:#FFD100;letter-spacing:1px}
.hdr em{font-size:10px;color:#888;margin-left:auto;font-style:normal}
.msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0}
.bbl{max-width:88%;padding:9px 13px;border-radius:12px;font-size:12px;line-height:1.55;word-break:break-word}
.bbl.u{background:#000;color:#FFD100;align-self:flex-end;border-radius:12px 12px 3px 12px;font-weight:600}
.bbl.a{background:#fff;color:#222;align-self:flex-start;border:1px solid #ddd;border-radius:12px 12px 12px 3px}
.bbl.a b{color:#000}
.bbl.t{background:#fff;border:1px solid #ddd;align-self:flex-start;padding:8px 13px;color:#888;font-size:11px}
.dots span{display:inline-block;width:6px;height:6px;background:#FFD100;border-radius:50%;animation:bo 1.2s infinite;margin:0 2px}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bo{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
.suggs{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.sg{background:#f0f0f0;border:1.5px solid #ddd;color:#555;font-size:11px;padding:5px 11px;border-radius:14px;cursor:pointer;font-family:inherit}
.sg:hover{border-color:#FFD100;color:#000}
.pdf-btn{display:inline-flex;align-items:center;gap:4px;margin-top:7px;background:none;border:1px solid #ddd;color:#888;font-size:10px;padding:3px 9px;border-radius:10px;cursor:pointer;font-family:inherit}
.pdf-btn:hover{border-color:#FFD100;color:#000}
.foot{padding:8px 10px;background:#fff;border-top:2px solid #FFD100;display:flex;gap:7px;align-items:center;flex-shrink:0}
#editor{flex:1;background:#f5f5f5;border:1.5px solid #ccc;color:#111;padding:9px 13px;border-radius:9px;font-size:13px;outline:none;font-family:inherit;min-height:38px;max-height:80px;overflow-y:auto;cursor:text}
#editor:focus{border-color:#FFD100;background:#fff}
#editor:empty:before{content:'Pergunte sobre qualquer dado do modelo...';color:#aaa;pointer-events:none}
#btn{background:#FFD100;color:#000;border:none;padding:9px 18px;border-radius:9px;font-size:14px;font-weight:900;cursor:pointer;flex-shrink:0}
#btn:disabled{opacity:.35}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="hdr"><div class="dot"></div><h1>QUARTZOLIT AI</h1><em id="hdrInfo">Assistente de Dados</em></div>
  <div class="msgs" id="msgs"><div class="bbl a" id="msgInicial">Ola!</div></div>
  <div class="foot"><div id="editor" contenteditable="true"></div><button id="btn">&#9658;</button></div>
</div>
<script>
var p = new URLSearchParams(window.location.search);
var atual=p.get('atual')||''; var ref=p.get('ref')||''; var uf=p.get('uf')||'Todos';
var vd=p.get('vd')||'0'; var va=p.get('va')||'0'; var vv=p.get('vv')||'0';
var rec=p.get('rec')||'0'; var vol=p.get('vol')||'0'; var mar=p.get('mar')||'0'; var pre=p.get('pre')||'0';
var al=p.get('al')||'';

var alertasCtx='';
if(al){ al.split('~').forEach(function(item){ var pt=item.split('|'); if(pt[0]){ alertasCtx+='\n- '+pt[0]+': '+(pt[1]||''); if(pt[2])alertasCtx+=' | '+pt[2]; if(pt[3])alertasCtx+=' | '+pt[3]; if(pt[4])alertasCtx+=' | '+pt[4]; }}); }

var slicerCtx = atual
  ? 'SLICER ATUAL DO DASHBOARD: '+atual+' vs '+ref+' | UF: '+uf+'\n'
    +'Score: '+vd+' verdes, '+va+' amarelas, '+vv+' vermelhas\n'
    +'Variacoes: Rec='+rec+'% Vol='+vol+'% Mar='+mar+'pp Pre='+pre+'%'
    +(alertasCtx ? '\nAlertas:'+alertasCtx : '')
  : '';

var suggs = '<div class="suggs">'
  +'<span class="sg" id="s1">Top 5 familias com score mais alto</span>'
  +'<span class="sg" id="s2">Faturamento por mes em 2025</span>'
  +'<span class="sg" id="s3">Top 5 familias por receita</span>'
  +'<span class="sg" id="s4">Resumo executivo</span>'
  +'</div>';

// Mensagem inicial IGUAL ao site - sem mostrar scores/periodo
var mi = document.getElementById('msgInicial');
mi.innerHTML = 'Ola! Sou a IA da Quartzolit com acesso ao modelo semantico Power BI.<br><br>'
  +'Posso responder sobre <b>qualquer dado disponivel no modelo</b>: '
  +'receita, faturamento, volume, margem, preco, por mes, familia, UF, filial.'
  +suggs;

['s1','s2','s3','s4'].forEach(function(id){
  var el=document.getElementById(id);
  if(el) el.addEventListener('click',function(){ ed.textContent=this.textContent; go(); });
});

var H=[]; var M=document.getElementById('msgs'); var ed=document.getElementById('editor'); var btn=document.getElementById('btn');
function sb(){M.scrollTop=M.scrollHeight;}
function boldify(t){var parts=t.split('**');var r='';for(var i=0;i<parts.length;i++)r+=i%2===0?parts[i]:'<b>'+parts[i]+'</b>';return r.split('\n').join('<br>');}
function exportPdf(txt,pergunta){
  var w=window.open('','_blank','width=700,height=900');
  w.document.write('<html><head><meta charset="UTF-8"><title>Quartzolit AI — Exportar</title>'
    +'<style>body{font-family:Segoe UI,sans-serif;padding:32px 40px;color:#222;max-width:700px;margin:auto}'
    +'h2{font-size:14px;color:#555;font-weight:400;margin-bottom:4px}'
    +'h1{font-size:18px;font-weight:700;margin-bottom:20px;border-bottom:3px solid #FFD100;padding-bottom:8px}'
    +'.content{font-size:13px;line-height:1.7;white-space:pre-wrap}'
    +'.footer{margin-top:40px;font-size:10px;color:#aaa;border-top:1px solid #eee;padding-top:10px}'
    +'@media print{button{display:none}}'
    +'</style></head><body>'
    +'<h2>Central de Comando — Quartzolit (Saint-Gobain Brasil)</h2>'
    +'<h1>'+pergunta.replace(/</g,'&lt;')+'</h1>'
    +'<div class="content">'+boldify(txt)+'</div>'
    +'<div class="footer">Gerado em '+new Date().toLocaleString('pt-BR')+' · Quartzolit AI</div>'
    +'<br><button onclick="window.print()" style="background:#FFD100;border:none;padding:8px 20px;font-weight:700;font-size:13px;border-radius:6px;cursor:pointer">Imprimir / Salvar PDF</button>'
    +'</body></html>');
  w.document.close();
}
function am(t,c){
  var d=document.createElement('div');
  d.className='bbl '+c;
  d.innerHTML=boldify(t);
  if(c==='a'){
    var lastUser=H.length>=2?H[H.length-2].content:'';
    var btn2=document.createElement('button');
    btn2.className='pdf-btn';
    btn2.innerHTML='&#128196; Exportar PDF';
    btn2.addEventListener('click',function(){exportPdf(t,lastUser);});
    d.appendChild(btn2);
  }
  M.appendChild(d);sb();
}
function st(msg){var d=document.createElement('div');d.className='bbl t';d.id='tp';d.innerHTML=msg||"<div class='dots'><span></span><span></span><span></span></div>";M.appendChild(d);sb();}
function rt(){var t=document.getElementById('tp');if(t)t.remove();}
function ut(msg){var t=document.getElementById('tp');if(t)t.innerHTML=msg;}

function precisaQuery(txt){
  return /faturamento|receita|volume|margem|custo|preco|sell.?in|jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez|janeiro|fevereiro|marco|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro|2024|2025|2026|mes|ano|total|quanto|historico|familia|categoria|filial|estado|uf|top|maior|menor|rank|evolucao|crescimento|queda/i.test(txt);
}
function precisaGrafico(txt){
  return /gr[áa]fico|gr[áa]f\b|chart|barra|pizza|linha|plot|visualiz|evoluc|tendencia/i.test(txt);
}
var _chartCount=0;
function renderChart(cfg,pergunta){
  _chartCount++;
  var cid='ch'+_chartCount;
  var wrap=document.createElement('div');
  wrap.className='bbl a';
  wrap.style.maxWidth='96%';
  var titulo=cfg.title||pergunta;
  wrap.innerHTML='<div style="font-size:11px;font-weight:700;color:#333;margin-bottom:8px">'+titulo+'</div>'
    +'<canvas id="'+cid+'" style="max-height:200px"></canvas>';
  var bpdf=document.createElement('button');
  bpdf.className='pdf-btn';
  bpdf.innerHTML='&#128196; Exportar PDF';
  bpdf.onclick=function(){
    var cv=document.getElementById(cid);
    var w=window.open('','_blank','width=720,height=620');
    w.document.write('<html><head><meta charset="UTF-8"><title>Quartzolit AI — Gráfico</title>'
      +'<style>body{font-family:Segoe UI,sans-serif;padding:32px;text-align:center}h1{font-size:15px;margin-bottom:16px}@media print{button{display:none}}</style></head>'
      +'<body><h1>'+titulo.replace(/</g,'&lt;')+'</h1><img src="'+cv.toDataURL()+'" style="max-width:100%"><br><br>'
      +'<p style="font-size:10px;color:#aaa">Gerado em '+new Date().toLocaleString('pt-BR')+' · Quartzolit AI</p><br>'
      +'<button onclick="window.print()" style="background:#FFD100;border:none;padding:8px 20px;font-weight:700;border-radius:6px;cursor:pointer">Imprimir / Salvar PDF</button>'
      +'</body></html>');
    w.document.close();
  };
  wrap.appendChild(bpdf);
  M.appendChild(wrap);sb();
  setTimeout(function(){
    var ctx2=document.getElementById(cid).getContext('2d');
    new Chart(ctx2,{
      type:cfg.type||'bar',
      data:{
        labels:cfg.labels||[],
        datasets:(cfg.datasets||[]).map(function(ds,i){
          var cl=['#FFD100','#222','#888','#ccc'];
          return {label:ds.label||'',data:ds.data||[],
            backgroundColor:cfg.type==='line'?'rgba(255,209,0,0.08)':(cl[i%4]),
            borderColor:cfg.type==='line'?'#FFD100':(cl[i%4]),
            borderWidth:cfg.type==='line'?2:1,fill:cfg.type==='line',
            tension:0.35,pointBackgroundColor:'#FFD100',pointRadius:3};
        })
      },
      options:{responsive:true,
        plugins:{legend:{labels:{font:{size:10},color:'#444'}}},
        scales:cfg.type!=='pie'?{y:{ticks:{font:{size:9}},grid:{color:'#f0f0f0'}},x:{ticks:{font:{size:9},maxRotation:45},grid:{display:false}}}:{}}
    });
  },80);
}

function go(){
  var t=(ed.textContent||ed.innerText||'').trim();
  if(!t)return;
  ed.textContent=''; btn.disabled=true;
  am(t,'u'); H.push({role:'user',content:t});

  if(precisaQuery(t)){
    st('Gerando consulta ao modelo...');
    fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'gerar_dax',question:t})
    }).then(function(r){return r.json();}).then(function(d){
      var daxQuery=d.dax||'';
      if(!daxQuery){ ut('Interpretando...'); return callClaude(t,slicerCtx); }
      ut('Consultando modelo semantico Power BI...');
      return fetch('/api/query',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({dax:daxQuery})
      }).then(function(r2){return r2.json();}).then(function(qd){
        ut('Interpretando dados...');
        var queryCtx='';
        var rows=[];
        if(qd.results&&qd.results[0]&&qd.results[0].tables){
          rows=qd.results[0].tables[0].rows||[];
          if(rows.length>0) queryCtx='DADOS REAIS DO MODELO:\n'+JSON.stringify(rows).substring(0,2000);
          else queryCtx='Consulta retornou 0 linhas.';
        } else if(qd.error){ queryCtx='Erro: '+JSON.stringify(qd.error); }
        if(precisaGrafico(t)&&rows.length>0){
          ut('Gerando gráfico...');
          fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({action:'gerar_grafico',question:t,dados:rows})
          }).then(function(r3){return r3.json();}).then(function(gd){
            rt();
            if(gd.chartConfig){renderChart(gd.chartConfig,t);}
            else{callClaude(t,(slicerCtx?slicerCtx+'\n\n':'')+queryCtx);return;}
            btn.disabled=false;ed.focus();
          }).catch(function(){rt();callClaude(t,(slicerCtx?slicerCtx+'\n\n':'')+queryCtx);});
        } else {
          callClaude(t,(slicerCtx?slicerCtx+'\n\n':'')+queryCtx);
        }
      });
    }).catch(function(e){ ut('Erro: '+e.message); setTimeout(function(){callClaude(t,slicerCtx);},500); });
  } else {
    st();
    callClaude(t,slicerCtx);
  }
}

function callClaude(pergunta,ctx){
  fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages:H,pbiContext:ctx})
  }).then(function(r){return r.json();}).then(function(d){
    rt();
    if(d.content&&d.content[0]){var rep=d.content[0].text;H.push({role:'assistant',content:rep});am(rep,'a');}
    else if(d.error){am('Erro: '+(d.error.message||d.error),'a');}
    else{am('Sem resposta.','a');}
    btn.disabled=false;ed.focus();
  }).catch(function(e){rt();am('Erro: '+e.message,'a');btn.disabled=false;});
}

btn.addEventListener('click',function(){go();});
ed.addEventListener('keydown',function(e){if(e.keyCode===13&&!e.shiftKey){e.preventDefault();go();}});
function fix(){var w=document.querySelector('.wrap');if(w)w.style.height=window.innerHeight+'px';}
window.addEventListener('resize',fix);fix();
</script>
</body>
</html>
